allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

peerDependencyRules:
  allowedVersions:
    "@vercel/analytics>vue-router": "^5.2.0"
    "@vercel/speed-insights>vue-router": "^5.2.0"
    "unctx>oxc-parser": "^0.139.0"
    "unctx>unplugin": "^2.3.11"
onlyBuiltDependencies:
  - "@parcel/watcher"
  - better-sqlite3
  - esbuild
  - sharp
  - unrs-resolver
  - vue-demi
minimumReleaseAgeExclude:
  - "@nuxt/kit@4.5.1"
  - "@nuxt/nitro-server@4.5.1"
  - "@nuxt/schema@4.5.1"
  - "@nuxt/vite-builder@4.5.1"
  - nuxt@4.5.1
